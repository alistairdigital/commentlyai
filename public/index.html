<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CommentlyAI — Your voice. At scale.</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="wordmark">
      <svg class="logo" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M8 20c0-2 1-3 2-3s2 3 2 3 1-8 3-8 2 12 3 12 1-16 4-16 2 20 3 20 1-6 2-6 2 1.5 2 1.5" fill="none" stroke="url(#g)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M30 10c4 3 4 17 0 20" fill="none" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="40" y2="40">
            <stop offset="0" stop-color="#5B21B6"/>
            <stop offset="1" stop-color="#06B6D4"/>
          </linearGradient>
        </defs>
      </svg>
      <h1><span class="brand-main">Commently</span><span class="brand-accent">AI</span></h1>
    </div>
    <p class="tagline">Your voice. At scale.</p>
  </header>

  <main class="layout">
    <section class="panel" id="voice-panel">
      <h2>Your base voice</h2>
      <p class="hint">Three adjectives that describe you. This stays constant — only the register shifts per context.</p>
      <div class="voice-inputs">
        <input type="text" id="voice-1" placeholder="e.g. direct" maxlength="30" />
        <input type="text" id="voice-2" placeholder="e.g. curious" maxlength="30" />
        <input type="text" id="voice-3" placeholder="e.g. precise" maxlength="30" />
      </div>
    </section>

    <section class="panel" id="context-panel">
      <h2>Context selector</h2>
      <div class="context-row">
        <select id="preset-select"></select>
        <button id="add-preset-btn" class="btn-secondary" type="button">+ Add preset</button>
      </div>
      <div class="context-detail" id="context-detail"></div>

      <form id="add-preset-form" class="add-preset-form hidden">
        <input type="text" id="new-preset-name" placeholder="Preset name" required />
        <input type="text" id="new-preset-creator" placeholder="Creator type (e.g. engineer)" required />
        <input type="text" id="new-preset-industry" placeholder="Industry/niche (e.g. fintech)" required />
        <input type="text" id="new-preset-voice" placeholder="Voice profile (e.g. sharp + data-driven)" required />
        <div class="form-actions">
          <button type="submit" class="btn-primary">Save preset</button>
          <button type="button" id="cancel-preset-btn" class="btn-secondary">Cancel</button>
        </div>
      </form>
    </section>

    <section class="panel" id="generator-panel">
      <h2>Comment generator</h2>
      <textarea id="post-text" rows="6" placeholder="Paste the LinkedIn post text here..."></textarea>
      <input type="url" id="post-url" placeholder="Post URL (optional)" />
      <button id="generate-btn" class="btn-primary" type="button">Generate comment</button>

      <div id="result-area" class="result-area hidden">
        <div class="result-meta" id="result-meta"></div>
        <p id="result-comment"></p>
        <button id="copy-btn" class="btn-secondary" type="button">Copy to clipboard</button>
      </div>
      <div id="error-area" class="error-area hidden"></div>
    </section>

    <section class="panel" id="log-panel">
      <h2>Creator / post log</h2>
      <div id="log-list" class="log-list"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
